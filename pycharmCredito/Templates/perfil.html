<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - ARO</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}">
</head>

<body>

   <header class="cabecalho">
        <a href="{{ url_for('novo') }}">
            <img src="{{ url_for('static', filename='uploads/logo-horizontal.png') }}" alt="Logo ARO" class="logo">
        </a>
        <nav class="menu">
            <a href="{{ url_for('novo') }}">Início</a>
            <a><span>Empréstimos</span></a>
            <a><span>Novo empréstimo</span></a>
            <a><span>Movimento</span></a>
        </nav>

        <div class="acoes">
            <form action="{{ url_for('logout') }}" method="POST">
                <button type="submit" class="botao-sair">➜</button>
            </form>
            <a href="{{ url_for('perfil') }}">
                <img src="{{ url_for('static', filename='uploads/perfil.png') }}" alt="Perfil" class="perfil">
            </a>
        </div>
    </header>

    <!-- CONTEÚDO -->
    <main>

        <h3>Meu Perfil</h3>
        <p class="subtitulo">Visualize seus dados cadastrais.</p>

        <section class="perfil">

            <div class="foto-perfil">
                <div class="avatar">●</div>
                <h3>Empreendedor</h3>
            </div>

            <div class="dados">

                <div class="informacao">
                    <span class="icone">●</span>
                    <div>
                        <p>Nome</p>
                        <strong>{{ usuario[1] }}</strong>
                    </div>
                </div>

                <div class="informacao">
                    <span class="icone">✉</span>
                    <div>
                        <p>Email</p>
                        <strong>{{ usuario[2] }}</strong>
                    </div>
                </div>

                <div class="informacao">
                    <span class="icone">▣</span>
                    <div>
                        <p>Cargo</p>
                        <strong>Empreendedor</strong>
                    </div>
                </div>
                <a class="alterar" href="{{ url_for('editar_usuario') }}">
                    Alterar dados
                </a>
            </div>

        </section>

        <form action="{{ url_for('logout') }}" method="POST">
            <button class="sair" type="submit">Sair da conta</button>
        </form>

    </main>

    <!-- RODAPÉ -->
    <footer>

        <div class="links-rodape">
            <a href="{{ url_for('novo') }}">Início</a>
            <a href="#">Empréstimos</a>
            <a href="#">Novo empréstimo</a>
            <a href="#">Movimento</a>
            <a href="{{ url_for('perfil') }}">Perfil</a>
        </div>

        <p>Termos de uso | Política de privacidade</p>

    </footer>

</body>

</html>
