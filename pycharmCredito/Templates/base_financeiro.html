<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - ARO</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/financeiro.css') }}">
</head>

<body>
    <header>
        <a href="{{ url_for('novo') }}"><img class="logo"
                src="{{ url_for('static', filename='uploads/logo-horizontal.png') }}" alt="ARO"></a>
        <nav aria-label="Menu principal">
            <a href="{{ url_for('novo') }}">Início</a>
            <a href="{{ url_for('receitas') }}">Receitas</a>
            <a href="{{ url_for('despesas') }}">Despesas</a>
            <a href="{{ url_for('saldos_mensais') }}">Saldo mensal</a>
            <a href="{{ url_for('perfil') }}">Perfil</a>
        </nav>
        <form action="{{ url_for('logout') }}" method="POST"><button>Sair</button></form>
    </header>
    <main>
        <h1>{{ titulo }}</h1>
        <!-- O Flask envia mensagens após cada ação. -->
        {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
        <p role="status" class="mensagem {{ categoria }}">{{ mensagem }}</p>
        {% endfor %}
        {% block conteudo %}{% endblock %}
    </main>
</body>

</html>
