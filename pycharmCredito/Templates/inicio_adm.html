<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - ARO</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inicio_adm.css') }}">
</head>

<body>

    <header class="cabecalho-aro">
        <a href="{{ url_for('novo') }}" class="marca-aro">
            <img
                src="{{ url_for('static', filename='uploads/logo-horizontal.png') }}"
                alt="Logo ARO"
                class="logo-aro">
        </a>

        <nav class="menu-aro">
            <a href="{{ url_for('novo') }}">Início</a>
            <a href="{{ url_for('pagina_taxas') }}">Taxas</a>
            <a href="#">Exercícios</a>
            <a href="#">Empreendedores</a>
        </nav>

        <div class="acoes-aro">
            <a href="{{ url_for('perfil_adm') }}">
                <img src="{{ url_for('static', filename='uploads/perfil.png') }}" alt="Perfil" class="perfil">
            </a>

            <form action="{{ url_for('logout') }}" method="POST">
                <button type="submit" class="sair-aro">Sair</button>
            </form>
        </div>
    </header>

    <!-- CONTEÚDO -->
    <main>

        <h1>Olá, {{ usuario }}!</h1>

        <!-- Somente a página do administrador tem este botão. -->
        <a href="{{ url_for('pagina_taxas') }}" class="botao">Gerenciar taxas</a>

        {% with mensagens = get_flashed_messages(with_categories=true) %}

        {% for categoria, mensagem in mensagens %}
        <p class="mensagem {{ categoria }}">{{ mensagem }}</p>

        {% endfor %}

        {% endwith %}

    </main>

</body>

</html>
