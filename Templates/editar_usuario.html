{% extends "base_financeiro.html" %}
{% set titulo = "Editar perfil" %}
{% block conteudo %}

            <section class="card">
                <h1>Editar Perfil</h1>
                <p>Atualize suas informações pessoais e financeiras.</p>
                
                <form action="{{ url_for('salvar_edicao') }}" method="POST">
                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" value="{{ usuario[1] }}" required>
                    </div>
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" value="{{ usuario[2] }}" required>
                    </div>
                    <div class="campo">
                        <label for="senha">Nova senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Deixe vazio para manter a senha atual">
                    </div>
                    <div class="campo">
                        <label for="confirmar_senha">Confirmar nova senha</label>
                        <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Repita a nova senha caso inseriu uma nova senha" >
                    </div>
                    <div class="campo">
                        <label for="renda">Renda mensal</label>
                        <input type="number" id="renda" name="renda_mensal" value="{{ usuario[3] or 0 }}" min="0" step="0.01" required>
                    </div>
                    <div class="campo">
                        <label for="despesas">Despesas mensais</label>
                        <input type="number" id="despesas" name="despesas_mensal" value="{{ usuario[4] or 0 }}" min="0" step="0.01" required>
                    </div>
                    <button type="submit" class="botao-salvar">Salvar alterações</button>
                </form>
                <a href="{{ url_for('perfil') }}" class="botao-voltar">Voltar</a>
            </section>
        
{% endblock %}
