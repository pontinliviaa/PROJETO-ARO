{% extends "base_financeiro.html" %}
{% set titulo = "Meu perfil" %}
{% block conteudo %}
<h1>Meu perfil</h1>
<section class="perfil-cartao">
    <div class="foto-perfil">
        {% if usuario[3] %}
        <img class="foto-usuario" src="{{ url_for('static', filename='uploads/' + usuario[3]) }}" alt="Sua foto de perfil">
        {% else %}
        <img class="foto-usuario" src="{{ url_for('static', filename='uploads/perfil.png') }}" alt="Perfil">
        {% endif %}
        <form method="POST" action="{{ url_for('salvar_foto') }}" enctype="multipart/form-data">
            <label for="foto">Foto de perfil (PNG ou JPG, até 5 MB)</label>
            <input id="foto" type="file" name="foto" accept="image/png,image/jpeg" required>
            <button type="submit">Enviar foto</button>
        </form>
    </div>
    <div><h2>{{ usuario[1] }}</h2><p>{{ usuario[2] }}</p>
        <p>{{ 'Administrador' if session['tipo_usuario'] == 1 else 'Usuário' }}</p>
        <a class="botao" href="{{ url_for('editar_usuario') }}">Alterar dados</a>
    </div>
</section>
{% endblock %}
